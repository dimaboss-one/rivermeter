<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Замер реки — байдарка</title>
  <script type="module" crossorigin src="./assets/index-BPuM4kkJ.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-cl5rsChZ.css">
</head>
<body>
  <div id="map"></div>
  <div id="me"></div>
  <aside id="panel">
    <input id="q" placeholder="🔍 Найти реку по названию" autocomplete="off">
    <div id="found"></div>
    <input id="name" placeholder="Название маршрута" value="Маршрут">
    <div class="row">
      <button id="undo">↶ Убрать точку</button>
      <button id="clear">Сбросить</button>
      <button id="ins">➕ Вставить точку</button>
      <button id="keep2">Только старт и финиш</button>
      <select id="pdfScale"><option value="mid">PDF: средний (~1:50 000)</option><option value="detail">PDF: подробный (~1:25 000)</option><option value="overview">PDF: обзор, 1 лист</option></select>
      <button id="pdf" class="primary">PDF A4</button>
    </div>
    <div class="row">
      <button id="where">📍 Где я</button>
      <button id="save">💾 Сохранить</button>
      <button id="gpx">GPX</button>
    </div>
    <div class="row"><select id="saved"></select><button id="del">🗑</button></div>
    <div class="row">
      <button id="ya">Я.Карты</button>
      <button id="yt">YouTube</button>
      <button id="wm">wmbel.by</button>
      <button id="lvl">Уровень воды</button>
    </div>
    <label class="chk"><input type="checkbox" id="showObjs" checked> Показывать объекты на карте</label>
    <div id="status">Приблизьтесь к реке (масштаб 11+) и ставьте точки кликом.</div>
    <div id="total"></div>
    <h3>Точки</h3>
    <table id="pts"></table>
    <h3>Реестр объектов</h3>
    <table id="objs"></table>
    <h3>💧 Уровень воды</h3>
    <div id="lvlbox">Поставьте первую точку на реке.</div>
  </aside>
</body>
</html>
