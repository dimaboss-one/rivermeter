name: Уровни воды
on:
  schedule:
    - cron: '30 4 * * *'   # каждый день 07:30 по Минску
  workflow_dispatch:
permissions:
  contents: write
jobs:
  levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/levels.cjs site/data/levels.json
      - run: |
          cd site
          git config user.name "levels-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/levels.json
          git diff --cached --quiet || (git commit -m "уровни воды" && git push)
